<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Интерактивная карта городских автобусных маршрутов и остановок Подгорицы.">
  <meta name="theme-color" content="#071b2a">
  <title>Автобусы Подгорицы</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23071b2a'/%3E%3Cpath d='M18 15h28a6 6 0 0 1 6 6v24a5 5 0 0 1-5 5h-1v4a3 3 0 0 1-6 0v-4H24v4a3 3 0 0 1-6 0v-4h-1a5 5 0 0 1-5-5V21a6 6 0 0 1 6-6Z' fill='%23ffd166'/%3E%3Crect x='18' y='21' width='28' height='14' rx='2' fill='%23f5fbff'/%3E%3Ccircle cx='22' cy='43' r='3' fill='%23071b2a'/%3E%3Ccircle cx='42' cy='43' r='3' fill='%23071b2a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://tile.openstreetmap.org">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Городской транспорт</p>
        <h1>Автобусы Подгорицы</h1>
      </div>
      <div class="topbar-actions">
        <span class="network-summary" id="networkSummary">Готовим карту…</span>
        <button class="sources-button" id="sourcesButton" type="button" aria-label="Открыть источники данных">
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 10.5v6M12 7.5h.01"></path></svg>
          <span>Источники</span>
        </button>
        <button class="location-button" id="locateButton" type="button" aria-label="Показать моё местоположение" aria-pressed="false">
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"></path></svg>
          <span data-locate-label>Где я</span>
        </button>
      </div>
    </header>

    <section class="map-workspace" aria-label="Карта автобусных маршрутов Подгорицы">
      <div id="map" role="application" aria-label="Интерактивная карта"></div>
      <aside class="panel" id="panel" aria-live="polite">
        <p class="panel-kicker">Маршруты и остановки</p>
        <h2>Готовим карту…</h2>
        <p>Загружаем маршрутную сеть Подгорицы.</p>
      </aside>
      <div class="map-message" id="mapMessage" role="status" hidden></div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <noscript>Для интерактивной карты нужно включить JavaScript.</noscript>
</body>
</html>
